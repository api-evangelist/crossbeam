note: >-
  Crossbeam publishes a four-tier plan ladder with real list prices on the two lower tiers and
  "custom" on the two upper tiers. The unit that matters for API consumers is the annual
  "unique record export" allowance, because Crossbeam's own developer docs state that REST API
  reads and webhook deliveries both draw down that allowance — it is the closest thing the
  company publishes to an API quota. API access itself is not sold as a line item: the REST
  Partner API is positioned for Enterprise, webhooks (Signals) are Enterprise-only, and the
  remote MCP server is in Limited Availability for Supernode and Enterprise by approved domain.
