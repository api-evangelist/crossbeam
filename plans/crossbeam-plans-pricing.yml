quota_notes:
  - >-
    "Unique record exports" is the metered unit across the ladder: 5,000 (Connector) → 25,000
    (Supernode) → 100,000+ (Enterprise).
  - >-
    Crossbeam's developer documentation states that API reads and webhook deliveries count
    toward the Record Export allowance, so integrations should filter server-side rather than
    poll. See rate-limits/crossbeam-rate-limits.yml.
