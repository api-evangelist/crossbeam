  - https://gitlab.com/crossbeam-public
  - https://github.com/getcrossbeam
note: >-
  Crossbeam ships no conventional multi-language SDK family. The one first-party package
  published to a registry is a Singer.io tap for data extraction; the rest of Crossbeam's
  first-party client code is published as sample/reference apps in its public GitLab group,
  not as installable libraries. Name collisions were checked and excluded: the RubyGems gem
  `crossbeam` (tarellel/crossbeam, a service-object gem) and the widely used Rust `crossbeam`
  concurrency crates are unrelated projects that merely share the name — neither is credited
  here. Two genuinely Crossbeam-targeting packages exist but are third-party and are marked
  official: false.
