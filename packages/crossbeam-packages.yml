source: >-
  Registry searches against npm, PyPI, RubyGems, crates.io, Packagist, NuGet, Maven Central and
  pkg.go.dev, plus Crossbeam's own public source org (gitlab.com/crossbeam-public) and GitHub
  org (github.com/getcrossbeam).
docs:
