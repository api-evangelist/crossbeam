aid: crossbeam
name: Crossbeam
description: >-
  Crossbeam is the leading Ecosystem-Led Growth (ELG) platform: a secure data-collaboration
  network that lets companies compare CRM data with their partners to uncover shared customers,
  overlapping prospects, and co-selling opportunities without exposing sensitive records. It
  turns partner-sourced overlaps, populations, and real-time signals into "Ecosystem
  Intelligence" that flows into GTM tools and AI agents. Crossbeam exposes this data through a
  REST Partner API (OAuth 2.0), real-time Signals webhooks, a remote MCP server, and in-app AI
  Chat, backed by SOC 2 Type II, GDPR, CCPA, and PCI DSS compliance.
