- name: get_list_link
  description: Generate shareable Crossbeam list links.
- name: search_crossbeam_knowledge
  description: Answer product questions and ELG best practices.
- name: get_partner_suggestions
  description: Recommend potential new partners.
deployment:
  mode: remote
  endpoint: https://mcp.crossbeam.com/mcp
  auth: oauth
  verified: probed
  tools: 9
  checked: '2026-08-14'
  note: >-
    Remote only — Crossbeam ships no stdio package and publishes no npx/pip install. The
    endpoint host resolves to Crossbeam-operated infrastructure (k8s-mcp AWS ELB on
    crossbeam.com) and its protected-resource document self-identifies as
    resource_name "Crossbeam MCP", which is what establishes ownership.
